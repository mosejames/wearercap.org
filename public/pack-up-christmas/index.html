*{box-sizing:border-box}
body{margin:0;min-height:100svh;color:#fff;font:1rem/1.5 system-ui,sans-serif;background:radial-gradient(circle,#b4d2ff24 1px,transparent 1.5px) 0 0/24px 24px,radial-gradient(ellipse at 50% 45%,#224b92,#081837 75%)}

footer{margin:1.25rem auto 0;max-width:25rem;color:#bdcbe2;font-size:.85rem}
h1{font:400 clamp(2.5rem,10vw,5rem)/.92 "Bebas Neue",Impact,"Arial Narrow",sans-serif;text-transform:uppercase;margin:.65rem 0}
h1 span{display:block;color:#f5cf77}
.intro{color:#e0eaff;margin:.65rem auto;max-width:25rem}
.ornaments{position:absolute;inset:0 0 auto;height:5rem;pointer-events:none}
.ornament{position:absolute;top:var(--drop);left:var(--left);width:var(--size);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff0ba,#d89d44 45%,#7a4d19);box-shadow:0 4px 12px #0006}
.ornament:nth-child(2){background:radial-gradient(circle at 30% 28%,#a7cdff,#3b70d4 42%,#172f73);outline:1px solid #8eb4f580}
.ornament:nth-child(3){background:radial-gradient(circle at 30% 28%,#ffc0aa,#c72637 43%,#601125)}
.ornament:nth-child(4){background:radial-gradient(circle at 30% 28%,#818998,#242832 42%,#05070a);outline:1px solid #aebad880}
.ornament:nth-child(5){background:radial-gradient(circle at 30% 28%,#a9efba,#2e8754 43%,#103825)}
.ornament:nth-child(6){background:radial-gradient(circle at 30% 27%,#fff2c87d,transparent 45%),repeating-linear-gradient(145deg,#f6d37d 0 3px,#bf832f 3px 6px)}
.ornament::before{content:"";position:absolute;left:calc(50% - .5px);bottom:100%;height:var(--drop);width:1px;background:#eecb80aa}
.ornament::after{content:"";position:absolute;left:35%;bottom:93%;width:30%;height:.24rem;border-radius:2px;background:linear-gradient(90deg,#b8893f,#ffe6a3,#a97430)}
.ornament:nth-child(1){--left:5%;--drop:2.2rem;--size:1.45rem}
.ornament:nth-child(2){--left:14%;--drop:1.35rem;--size:1rem}
.ornament:nth-child(3){--left:22%;--drop:2.65rem;--size:1.1rem}
.ornament:nth-child(4){--left:68%;--drop:1.65rem;--size:1.4rem}
.ornament:nth-child(5){--left:80%;--drop:2.85rem;--size:1.6rem}
.ornament:nth-child(6){--left:91%;--drop:1.45rem;--size:1rem}
svg{display:block;width:min(100%,35rem);margin:.75rem auto .2rem;overflow:visible}
.count{margin:.35rem 0 1rem;color:#adbfdf;font-size:clamp(1.4rem,5vw,2rem);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.count-window{display:inline-block;height:1em;overflow:hidden;vertical-align:bottom;text-align:right}
.count-reel,.count-reel span{display:block}
.count strong{color:white;font-size:clamp(3.6rem,13vw,5.5rem);font-weight:850;line-height:1}

.over-goal{margin:.35rem auto 0;color:#f5cf77;font-weight:750}
</style>
<main>
<div class="ornaments" aria-hidden="true"><span class="ornament"></span><span class="ornament"></span><span class="ornament"></span><span class="ornament"></span><span class="ornament"></span><span class="ornament"></span></div>
<h1>We made it! <span>Thank you!</span></h1>
<p class="intro">RCA’s Christmas trees are getting the storage they need.</p>
<p class="count"><strong id="count">34</strong> / 32 bags funded</p>

<g id="fill">

<path id="front" d="M161 73 583 55V219L161 244Z" fill="url(#gold)" stroke="#ffe78a" stroke-width="1.5"/>

<path d="M315 67C321 164 455 175 462 60" stroke="#0d1932" stroke-width="8" fill="none"/>
<path d="M296 59C314 35 424 31 451 53" stroke="#c1d3ee" stroke-opacity=".4" stroke-width="5" fill="none"/>

<path d="M300 38l7-.5m7 0l7-.5" stroke="#ffd73c" stroke-width="4" stroke-linecap="round"/>
<rect x="372" y="129" width="32" height="34" rx="3" fill="#142542" stroke="#b1c5e6" stroke-width="1.5"/>

</main>
<script>
const confirmedBags = 34;
const goal = 32;
const count = document.querySelector("#count");
const level = document.querySelector("#level");
const front = document.querySelector("#front");
const end = document.querySelector("#end");
const surface = document.querySelector("#surface");

function paintFill(shown) {
  const fraction = Math.min(shown / goal, 1);
  const left = 212 - 160 * fraction;
  const corner = 244 - 171 * fraction;
  const right = 219 - 164 * fraction;
  const back = 184 - 161 * fraction;
  level.setAttribute("cy", right);
  front.setAttribute("d", `M161 ${corner} 583 ${right}V219L161 244Z`);
  end.setAttribute("d", `M27 ${left} 161 ${corner}V244L27 212Z`);
  surface.setAttribute("d", `M27 ${left} 439 ${back} 583 ${right} 161 ${corner}Z`);
}

if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const windowEl = document.createElement("span");
  windowEl.className = "count-window";
  windowEl.setAttribute("aria-hidden", "true");
  const reel = document.createElement("span");
  reel.className = "count-reel";
  for (let number = 0; number <= confirmedBags; number++) {
    const row = document.createElement("span");
    row.textContent = number;
    reel.append(row);
  }
  windowEl.append(reel);
  count.setAttribute("aria-label", String(confirmedBags));
  count.replaceChildren(windowEl);
  paintFill(0);

  let start;
  function animate(now) {
    start ??= now;
    const progress = Math.min(1, (now - start) / 2450);
    const shown = confirmedBags * (progress * progress * (3 - 2 * progress));
    paintFill(shown);
    reel.style.transform = `translateY(${-shown}em)`;
    if (progress < 1) requestAnimationFrame(animate);
    else {
      count.textContent = confirmedBags;
      count.removeAttribute("aria-label");
    }
  }
  requestAnimationFrame(animate);
}
</script>
