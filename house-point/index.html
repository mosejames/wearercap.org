:root{--ink:#10243b;--muted:#6d7d90;--navy:#0a1930;--blue:#1648aa;--line:#e2e9f0;--surface:#fff;--bg:#f4f7fb;--gold:#f6bd52;--green:#16825f;--red:#b84143;--shadow:0 15px 35px rgba(21,48,83,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}aside{background:#0b1e39;color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:30px}.logo{display:flex;align-items:center;gap:12px;padding:0 10px;font-family:Manrope;font-weight:800;letter-spacing:-.04em;font-size:18px}.logotext{line-height:1.25}.mark{flex-shrink:0;width:38px;height:38px;background:linear-gradient(145deg,#3377e2,#1c3b8f);border:1px solid #8bb6fc;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:0 6px 16px #102957}.brandnote{font-size:11px;color:#9db0c9;letter-spacing:.13em;text-transform:uppercase;margin:0 10px 9px}.nav{display:grid;gap:5px}.nav button{background:none;border:0;color:#aebed1;text-align:left;padding:13px 14px;border-radius:11px;display:flex;align-items:center;gap:12px;font-weight:700;width:100%}.nav button.active,.nav button:hover{background:#1b3558;color:#fff}.nav button span:first-child{font-size:19px;width:24px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #2e4260;padding:20px 10px 0;font-size:12px;color:#a6bad1;line-height:1.6}.sidefoot b{color:#fff;font-size:13px}main{min-width:0}.topbar{height:75px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,55px)}.topbar small{font-weight:800;text-transform:uppercase;letter-spacing:.11em;color:#7889a0}.teacher{display:flex;align-items:center;gap:11px;font-size:13px;font-weight:700}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#dfebff;color:#1748a0}.content{max-width:1280px;margin:auto;padding:36px clamp(18px,4vw,55px) 75px}.eyebrow{font-weight:800;color:#3768bb;text-transform:uppercase;font-size:11px;letter-spacing:.16em}h1{font-family:Manrope,sans-serif;font-size:clamp(28px,3vw,40px);letter-spacing:-.05em;line-height:1.16;margin:8px 0 10px}h2{font-family:Manrope,sans-serif;font-size:21px;letter-spacing:-.03em;margin:0}h3{font-family:Manrope,sans-serif;font-size:16px;margin:0}.sub{color:var(--muted);margin:0;line-height:1.6}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:27px}.btn{border:0;background:#184bad;color:white;border-radius:11px;padding:12px 17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;box-shadow:0 5px 12px #1648aa20}.btn:hover{background:#103b8d}.btn.secondary{background:#fff;color:#173652;border:1px solid #d7e2ee;box-shadow:none}.btn.secondary:hover{background:#f0f5fc}.btn.ghost{background:transparent;color:#26529a;box-shadow:none;padding:7px 5px}.btn.danger{background:#fff;color:#ae3b3f;border:1px solid #edd4d4;box-shadow:none}.btn.large{font-size:17px;padding:16px 24px;min-height:56px}.btn.full{width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.overview{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:16px}.overview>.card{padding:25px}.stat{font-family:Manrope;font-weight:800;font-size:32px;letter-spacing:-.05em;margin:11px 0 4px}.muted{color:var(--muted)}.progress{height:9px;border-radius:20px;background:#e9eff6;overflow:hidden;margin:18px 0 8px}.progress i{height:100%;display:block;background:linear-gradient(90deg,#2765bd,#65a6ef);border-radius:20px;transition:width .2s}.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:18px;margin-top:20px}.panel{padding:23px}.panelhead{display:flex;align-items:cen  73%);border-radius:18px;min-height:565px;position:relative;overflow:hidden;display:grid;place-items:center;color:white;border:7px solid #fff;box-shadow:var(--shadow)}.camera:before{content:'';position:absolute;inset:18px;border:1px solid #ffffff35;border-radius:12px;pointer-events:none}.cameralabel{position:absolute;top:32px;left:35px;font-size:11px;letter-spacing:.1em;font-weight:800;color:#d6e4ff}.guide{border:2px dashed #ffffff9b;border-radius:46% 46% 30% 30%;width:min(72%,330px);height:405px;position:absolute;top:75px;pointer-events:none}.guide:after{content:'HEAD + SHOULDERS';position:absolute;bottom:15px;left:0;right:0;text-align:center;color:#ffffffaa;font-size:10px;font-weight:800;letter-spacing:.14em}.figure{width:min(80%,345px);align-self:end;margin-bottom:28px;filter:drop-shadow(0 10px 24px #0006)}.figure svg{width:100%;height:auto;display:block}.camfoot{position:absolute;bottom:24px;left:30px;right:30px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#dbe6fa}.captureinfo{padding:27px}.stepper{display:flex;gap:7px;margin:23px 0}.stepper i{height:6px;border-radius:20px;background:#e7edf5;flex:1}.stepper i.on{background:#2764bc}.instruction{background:#f2f7ff;border:1px solid #dbe9ff;padding:16px;border-radius:12px;margin:20px 0;line-height:1.55;font-size:13px;color:#385777}.asset{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid #eaf0f6;padding:15px 0}.asset b{font-size:13px}.asset small{display:block;color:var(--muted);margin-top:3px}.preview{max-width:280px;height:290px;margin:15px auto;background:radial-gradient(circle at center,#22438d,#10234a);border:12px solid #d1d7e1;box-shadow:inset 0 0 0 3px #64758b,0 10px 20px #173b6325;border-radius:50%;display:grid;place-items:end center;overflow:hidden}.preview svg{width:93%;height:92%}.videopreview{max-width:190px;height:265px;border-radius:12px;border:5px solid #0e264c;margin:12px auto;background:linear-gradient(150deg,#103a77,#142c58);overflow:hidden;display:grid;place-items:end center;position:relative}.videopreview svg{width:95%;height:80%;animation:sway 2.1s ease-in-out infinite alternate}.videopreview:after{content:'▶  0:10';position:absolute;bottom:8px;left:10px;background:#091d36b8;color:white;border-radius:6px;padding:4px 7px;font-size:11px;font-weight:700}@keyframes sway{to{transform:translateX(5px) rotate(2deg)}}.reviewgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.reviewgrid article{border:1px solid var(--line);border-radius:13px;text-align:center;padding:14px}.reviewgrid .preview{height:195px;width:195px;border-width:8px}.reviewgrid .videopreview{height:195px;width:140px}.reviewgrid .videopreview svg{height:90%}.field{display:block;font-size:12px;font-weight:800;margin:17px 0 7px}.fieldinput{width:100%;border:1px solid #d7e2ec;border-radius:9px;padding:12px 13px;color:var(--ink);background:white}.dropzone{border:2px dashed #a9bfdc;border-radius:14px;padding:28px;text-align:center;background:#f6faff;margin:20px 0}.dropzone input{max-width:100%;margin-top:14px}.note{font-size:12px;color:#718399;line-height:1.6}.code{padding:15px;background:#0d213f;color:#cbe3ff;border-radius:10px;overflow:auto;font-size:12px;line-height:1.6}.importpreview{max-height:310px;overflow:auto}.importrow{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #e9edf2;padding:10px;gap:10px;font-size:12px}.importrow:first-child{background:#f5f8fb;font-weight:800}.banner{background:#ecf7f2;border:1px solid #cde9dd;border-radius:12px;padding:13px 16px;color:#267559;font-size:13px;font-weight:700;margin-bottom:17px}.empty{text-align:center;padding:35px;color:var(--muted)}.modalbg{position:fixed;inset:0;background:#07172bbb;z-index:5;display:grid;place-items:center;padding:15px}.modal{max-width:430px;width:100%;padding:27px;background:white;border-radius:18px;box-shadow:0 25px 80px #0005}.toast{position:fixed;bottom:18px;right:20px;background:#10243b;color:white;padding:12px 17px;border-radius:10px;font-size:13px;z-index:10;box-shadow:var(--shadow)}.mobilemenu{display:none}.hide{display:none!important}@media(max-width:950px){.app{grid-template-columns:76px 1fr}aside{padding:25px 10px}.logo{padding:0 8px}.logo .logotext,.brandnote,.nav button .navtext,.sidefoot{display:none}.nav button{justify-content:center;padding:12px}.nav button span:first-child{width:auto}.overview{grid-template-columns:1fr 1fr}.overview .card:first-child{grid-column:span 2}.capturelayout{grid-template-columns:1fr}.camera{min-height:470px}.figure{max-width:300px}}@media(max-width:650px){.app{display:block}aside{position:fixed;left:0;right:0;bottom:0;z-index:4;height:66px;padding:8px;background:#0b1e39;display:block}.logo,.brandnote,.sidefoot{display:none}.nav{grid-template-columns:repeat(4,1fr);gap:2px;height:100%}.nav button{font-size:12px;padding:5px}.nav button span:first-child{font-size:21px}.topbar{height:60px;padding:0 20px}.content{padding:26px 17px 94px}.heading{align-items:start;flex-direction:column}.overview{grid-template-columns:1fr 1fr;gap:9px}.overview .card{padding:16px}.stat{font-size:25px}.split{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.tablehead{display:none}.studentrow{grid-template-columns:minmax(0,1fr) auto;gap:7px}.studentrow>*:nth-child(2),.studentrow>*:nth-child(3){display:none}.camera{min-height:430px}.guide{height:320px;top:65px}.figure{max-width:250px}.captureinfo{padding:21px}.reviewgrid .preview{height:140px;width:140px}.reviewgrid .videopreview{height:140px;width:105px}.reviewgrid article{padding:10px}.teacher small{display:none}}
</style></head>
<body><div id="app"></div><script>
const STORAGE='rcaCapturePrototype_v1';
const seed=[['S-1001','Avery Johnson','Altruismo',0],['S-1002','Jordan Williams','Amistad',1],['S-1003','Kai Thompson','Isibindi',2],['S-1004','Morgan Lee','Reveur',3],['S-1005','Riley Davis','Amistad',4],['S-1006','Cameron Brooks','Altruismo',5],['S-1007','Taylor Reed','Isibindi',6],['S-1008','Parker Green','Reveur',7]].map((x,i)=>({id:x[0],name:x[1],house:x[2],look:x[3],photo:i===0||i===1,video:i===0}));
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||null}catch{};if(!state||!Array.isArray(state.students))state={teacher:'Ms. Carter',className:'Grade 5 • Homeroom',students:seed};
let view='home',studentId=null,stage='photo',draftPhoto=false,draftVideo=false,query='',importRows=null,notice='',recordTimer=null,recordSeconds=0,modal='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(STORAGE,JSON.stringify(state));const student=()=>state.students.find(s=>s.id===studentId);
const done=s=>s.photo&&s.video,complete=()=>state.students.filter(done).length,missing=()=>state.students.length-complete();
function portrait(s){let skin=['#b47750','#7e4c37','#ce9a74','#80553c','#b9855f','#533d34'][s.look%6],hair=['#241c23','#2a2426','#31282a','#241a20'][s.look%4],shirt=['#1857a8','#21448e','#297ab0','#2659a1'][s.look%4];return `<svg viewBox="0 0 300 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated sample portrait"><ellipse cx="150" cy="366" rx="137" ry="91" fill="${shirt}"/><path d="M68 378c6-63 20-89 57-99l25 26 25-26c40 10 54 36 58 99" fill="${shirt}"/><path d="M122 262v37l28 20 28-20v-37" fill="${skin}"/><ellipse cx="150" cy="171" rx="75" ry="99" fill="${skin}"/><path d="M76 169c-14-81 20-128 74-128 65 0 89 51 74 128-7-27-10-33-16-63-32 26-88 29-122 14-3 20-6 36-10 49z" fill="${hair}"/><ellipse cx="104" cy="184" rx="9" ry="15" fill="${skin}"/><ellipse cx="196" cy="184" rx="9" ry="15" fill="${skin}"/><path d="M115 174q13-7 26 0m17 0q13-7 26 0" stroke="${hair}" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="128" cy="184" r="3" fill="#261f21"/><circle cx="172" cy="184" r="3" fill="#261f21"/><path d="M148 190l-5 24h13m-19 22q13 12 27 0" fill="none" stroke="#633e38" stroke-width="3" stroke-linecap="round"/><path d="M119 290l31 33 31-33" fill="none" stroke="#d8e9fa" stroke-width="6"/><path d="M28 363q50-64 116-38l-19 24q-47-11-81 30m228-16q-50-64-116-38l19 24q47-11 81 30" fill="${skin}"/><path d="M101 362q48-21 98 0" fill="none" stroke="${skin}" stroke-width="24" stroke-linecap="round"/></svg>`}
function badge(s){return done(s)?'<span class="pill good">✓ Complete</span>':s.photo||s.video?'<span class="pill warn">◐ In progress</span>':'<span class="pill">○ Not started</span>'}
function nav(){let items=[['home','⌂','Overview'],['roster','▤','Class roster'],['import','⇧','Import students'],['handoff','↗','Display handoff']];return `<aside><div class="logo"><span class="mark">✦</span><span class="logotext">House Point Capture Studio</span></div><div><div class="brandnote">Teacher workspace</div><div class="nav">${items.map(([id,icon,label])=>`<button class="${view===id?'active':''}" onclick="go('${id}')" title="${label}"><span>${icon}</span><span class="navtext">${label}</span></button>`).join('')}</div></div><div class="sidefoot"><b>PROTOTYPE · DEMO DATA</b><br>Sample names and illustrations. No school system is connected.</div></aside>`}
function shell(inner){$('#app').innerHTML=`<div class="app">${nav()}<main><div class="topbar"><small>RCA House Point / Student media</small><div class="teacher"><span class="avatar">MC</span><span>${esc(state.teacher)}<br><small style="font-size:11px;color:#8594a7">Teacher demo</small></span></div></div><div class="content">${inner}</div></main></div>${modal?modalHTML():''}${notice?`<div class="toast">${esc(notice)}</div>`:''}`}
function home(){let next=state.students.find(s=>!done(s));shell(`<div class="heading"><div><span class="eyebrow">Good morning, ${esc(state.teacher)}</span><h1>Your class at a glance</h1><p class="sub">Capture a portrait and a short vertical video for every student.</p></div><button class="btn" onclick="start('${next?.id||state.students[0]?.id||''}')">${next?'▶ Continue capture':'View students'} →</button></div><div class="overview"><div class="card"><span class="eyebrow">${esc(state.className)}</span><div class="stat">${complete()} of ${state.students.length}</div><span class="muted">students fully captured</span><div class="progress"><i style="width:${state.students.length?100*complete()/state.students.length:0}%"></i></div><small class="muted">${missing()} remaining · photo + video required</small></div><div class="card"><span class="eyebrow">Photos ready</span><div class="stat">${state.students.filter(s=>s.photo).length}</div><span class="muted">of ${state.students.length} portraits</span></div><div class="card"><span class="eyebrow">Videos ready</span><div class="stat">${state.students.filter(s=>s.video).length}</div><span class="muted">of ${state.students.length} clips</span></div></div><div class="split"><section class="card panel"><div class="panelhead"><h2>Next to capture</h2><button class="btn ghost" onclick="go('roster')">View full roster →</button></div>${state.students.filter(s=>!done(s)).slice(0,5).map(s=>`<div class="listrow"><div class="person"><div class="mini">${portrait(s)}</div><div><b>${esc(s.name)}</b><small>${esc(s.house)} · ${esc(s.id)}</small></div></div><div class="row">${badge(s)}<button class="smallbtn" onclick="start('${esc(s.id)}')">Capture</button></div></div>`).join('')||'<div class="empty">Every student is complete. Nice work.</div>'}</section><section class="card panel"><h2>How this works</h2><div class="tips"><div class="tip"><i>1</i><span>Choose a student from your roster, or search for someone who came in out of order.</span></div><div class="tip"><i>2</i><span>Follow the pose guide for a waist-up portrait and a vertical 10-second video.</span></div><div class="tip"><i>3</i><span>Review both, save, and move to the next student. Missing items stay visible.</span></div></div><div class="instruction" style="margin-top:25px"><b>Demo mode</b><br>Capture buttons create clearly labeled illustrated placeholders, so you can explore the flow without using a child's image.</div></section></div>`)}
function roster(){let matches=state.students.filter(s=>`${s.name} ${s.id} ${s.house}`.toLowerCase().includes(query.toLowerCase()));shell(`<div class="heading"><div><span class="eyebrow">${esc(state.className)}</span><h1>Class roster</h1><p class="sub">Choose anyone, in any order. Capture resumes where you left off.</p></div><button class="btn secondary" onclick="go('import')">＋ Add or import students</button></div><div class="toolbar"><input class="search" aria-label="Search students" placeholder="⌕  Search name, ID, or house" value="${esc(query)}" oninput="searchRoster(this)"><span class="pill">${complete()} complete · ${missing()} need attention</span></div><div class="card table"><div class="tablehead"><span>Student</span><span>Portrait</span><span>Video</span><span>Status</span><span>Action</span></div>${matches.map(s=>`<div class="studentrow"><div class="person"><div class="mini">${portrait(s)}</div><div><b>${esc(s.name)}</b><small>${esc(s.id)} · ${esc(s.house)}</small></div></div><span class="pill ${s.photo?'good':''}">${s.photo?'✓ Ready':'○ Missing'}</span><span class="pill ${s.video?'good':''}">${s.video?'✓ Ready':'○ Missing'}</span>${badge(s)}<button class="smallbtn" onclick="start('${esc(s.id)}')">${done(s)?'View / retake':'Capture →'}</button></div>`).join('')||'<div class="empty">No students match your search.</div>'}</div>`)}
function capture(){let s=student();if(!s){go('roster');return}let step=stage==='photo'?1:stage==='video'?2:3;let isReview=stage==='review',isVideo=stage==='video';let visual=(stage==='photo'&&!draftPhoto)||(isVideo&&!draftVideo);shell(`<div class="heading"><div><span class="eyebrow">${esc(state.className)} / Capture session</span><h1>${esc(s.name)}</h1><p class="sub">${esc(s.id)} · ${esc(s.house)} · Step ${step} of 3</p></div><button class="btn secondary" onclick="go('roster')">← Back to roster</button></div><div class="capturelayout"><div class="camera"><div class="cameralabel">${isReview?'REVIEW':'DEMO CAMERA · '+(isVideo?'VERTICAL VIDEO':'PORTRAIT PHOTO')}</div><div class="guide"></div><div class="figure">${portrait(s)}</div><div class="camfoot"><span>✦ Illustrated placeholder · no camera access</span><span>${isVideo?'9:16':'4:5'}</span></div></div><div class="card captureinfo"><span class="eyebrow">${isReview?'Final check':isVideo?'Step 2 · Video':'Step 1 · Photo'}</span><h2 style="margin-top:7px">${isReview?'Ready to save?':isVideo?'Record a 10-second clip':'Take the portrait'}</h2><div class="stepper"><i class="on"></i><i class="${step>=2?'on':''}"></i><i class="${step>=3?'on':''}"></i></div>${isReview?`<p class="sub">Confirm both assets belong to ${esc(s.name)} before continuing.</p><div class="reviewgrid"><article><h3>Portrait</h3><div class="preview">${portrait(s)}</div><button class="btn ghost" onclick="stage='photo';draftPhoto=false;render()">↻ Retake photo</button></article><article><h3>Video</h3><div class="videopreview">${portrait(s)}</div><button class="btn ghost" onclick="stage='video';draftVideo=false;render()">↻ Retake video</button></article></div><button class="btn large full" onclick="finish()">✓ Save both and continue</button>`:isVideo?`<div class="instruction"><b>Teacher prompt</b><br>Keep the student in the same spot. Have them look at the camera, hold their pose, then give a natural smile. Record vertically for 10 seconds.</div><div class="asset"><div><b>Photo</b><small>Portrait saved for this session</small></div><span class="pill good">✓ Ready</span></div><div class="asset"><div><b>Video</b><small>Vertical · 10 seconds</small></div><span class="pill ${draftVideo?'good':''}">${draftVideo?'✓ Demo clip ready':'○ Waiting'}</span></div>${draftVideo?`<div class="videopreview">${portrait(s)}</div><div class="row"><button class="btn secondary" onclick="draftVideo=false;render()">↻ Retake</button><button class="btn" onclick="stage='review';render()">Review both →</button></div>`:`<button class="btn large full" id="recordBtn" onclick="recordDemo()">● Record demo clip</button><p class="note">The prototype simulates the countdown and generates an illustrated sample clip.</p>`}`:`<div class="instruction"><b>Teacher prompt</b><br>Have ${esc(s.name.split(' ')[0])} stand on the floor mark, facing the camera with arms crossed. Frame from the waist up and leave a little room around the shoulders.</div><div class="asset"><div><b>Portrait</b><small>Waist-up · centered · 4:5</small></div><span class="pill ${draftPhoto?'good':''}">${draftPhoto?'✓ Demo photo ready':'○ Waiting'}</span></div><div class="asset"><div><b>Video</b><small>Vertical · 10 seconds</small></div><span class="pill ${s.video?'good':''}">${s.video?'✓ Previously saved':'○ Next step'}</span></div>${draftPhoto?`<div class="preview">${portrait(s)}</div><div class="row"><button class="btn secondary" onclick="draftPhoto=false;render()">↻ Retake</button><button class="btn" onclick="stage='video';render()">Use photo → Record video</button></div>`:`<button class="btn large full" onclick="draftPhoto=true;render()">◎ Take demo photo</button><p class="note">In a production app this opens the device camera. This prototype generates sample artwork.</p>`}`}</div></div>`)}
function handoff(){shell(`<div class="heading"><div><span class="eyebrow">Administrator preview</span><h1>Display handoff</h1><p class="sub">See what a clean export would contain before connecting RCA's existing display software.</p></div></div><div class="overview"><div class="card"><span class="eyebrow">Students ready</span><div class="stat">${complete()}</div><span class="muted">photo + video</span></div><div class="card"><span class="eyebrow">Needs capture</span><div class="stat">${missing()}</div><span class="muted">incomplete records</span></div><div class="card"><span class="eyebrow">Connection</span><div class="stat" style="font-size:20px;margin-top:16px">Pending</div><span class="muted">display vendor details needed</span></div></div><div class="split"><section class="card panel"><h2>Export package preview</h2><p class="sub" style="margin-top:8px">Each row links a stable student ID to a portrait and video. Only fully captured students appear in the ready export.</p><pre class="code">student_id,name,class,house,photo,video\n${state.students.filter(done).slice(0,4).map(s=>`${s.id},${s.name},${state.className},${s.house},${s.id}_photo.jpg,${s.id}_video.mp4`).join('\n')||'(No complete records yet)'}</pre><div class="row"><button class="btn" onclick="downloadCSV()">↓ Download ready roster CSV</button><button class="btn secondary" onclick="downloadJSON()">↓ Download demo manifest</button></div><p class="note">These downloads contain sample metadata only. The prototype does not create actual image or video files.</p></section><section class="card panel"><h2>What RCA needs to confirm</h2><div class="tips"><div class="tip"><i>1</i><span>Name and version of the current display platform.</span></div><div class="tip"><i>2</i><span>Required portrait/video sizes, formats, duration, and naming rules.</span></div><div class="tip"><i>3</i><span>Whether the platform supports an API, bulk import, or manual upload.</span></div></div><div class="instruction">Once confirmed, this screen could show validation errors and a real <b>Publish to display</b> action. No live connection is implied here.</div></section></div>`)}
function importPage(){shell(`<div class="heading"><div><span class="eyebrow">Roster setup</span><h1>Add your students</h1><p class="sub">The school office can import a master roster; teachers can add a late arrival here.</p></div></div><div class="split"><section class="card panel"><h2>Import a CSV</h2><p class="sub" style="margin-top:8px">Use columns for student ID and name. Optional: house. Preview the rows before adding them.</p><div class="dropzone"><div style="font-size:28px">⇧</div><b>Choose a CSV file</b><br><input type="file" accept=".csv,text/csv" onchange="readCSV(this.files[0])"><p class="note">Data stays in this browser for the demo.</p></div>${importRows?`<div class="banner">${importRows.length} valid student${importRows.length===1?'':'s'} ready for review.</div><div class="importpreview"><div class="importrow"><b>ID</b><b>Name</b><b>House</b></div>${importRows.map(r=>`<div class="importrow"><span>${esc(r.id)}</span><span>${esc(r.name)}</span><span>${esc(r.house)}</span></div>`).join('')}</div><button class="btn" style="margin-top:16px" onclick="commitImport()">Import ${importRows.length} students</button>`:''}<p class="note">Example headers: <code>student_id,first_name,last_name,house</code>. The import also recognizes <code>name</code> or <code>student name</code>.</p></section><section class="card panel"><h2>Add one student</h2><label class="field" for="newName">Student name</label><input class="fieldinput" id="newName" placeholder="First and last name"><label class="field" for="newID">Student ID</label><input class="fieldinput" id="newID" placeholder="e.g. S-1009"><label class="field" for="newHouse">House (optional)</label><select class="fieldinput" id="newHouse"><option>Amistad</option><option>Altruismo</option><option>Isibindi</option><option>Reveur</option><option>Other</option></select><button class="btn" style="margin-top:20px" onclick="addOne()">＋ Add student</button><div class="instruction"><b>Real school setup</b><br>Roster import, teacher access, and student permissions would be handled by school administrators.</div></section></div>`)}
function render(){if(view==='home')home();else if(view==='roster')roster();else if(view==='capture')capture();else if(view==='import')importPage();else handoff()}
function go(v){clearInterval(recordTimer);view=v;notice='';render();window.scrollTo(0,0)}
function searchRoster(el){query=el.value;let p=el.selectionStart;render();let input=$('.search');input.focus();input.setSelectionRange(p,p)}
function start(id){if(!id){go('roster');return}studentId=id;let s=student();draftPhoto=!!s.photo;draftVideo=!!s.video;stage=s.photo&&!s.video?'video':done(s)?'review':'photo';go('capture')}
function recordDemo(){let btn=$('#recordBtn');recordSeconds=3;btn.disabled=true;btn.textContent='Starting in 3…';recordTimer=setInterval(()=>{recordSeconds--;if(recordSeconds>0){btn.textContent=`Starting in ${recordSeconds}…`}else{clearInterval(recordTimer);btn.textContent='● Recording sample…';setTimeout(()=>{if(view==='capture'&&stage==='video'){draftVideo=true;render()}},1200)}},600)}
function finish(){let s=student();s.photo=true;s.video=true;save();let next=state.students.find(x=>!done(x));notice=`${s.name} saved with photo + video.`;if(next){studentId=next.id;draftPhoto=!!next.photo;draftVideo=!!next.video;stage=next.photo?'video':'photo';render()}else{view='home';render()}setTimeout(()=>{notice='';$('.toast')?.remove()},3500)}
function addOne(){let name=$('#newName').value.trim(),id=$('#newID').value.trim(),house=$('#newHouse').value;if(!name||!id){alert('Enter both a student name and ID.');return}if(state.students.some(s=>s.id.toLowerCase()===id.toLowerCase())){alert('That student ID is already on the roster.');return}state.students.push({id,name,house,look:state.students.length,photo:false,video:false});save();notice=`${name} added.`;go('roster');notice=''}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(Boolean))rows.push(row);return rows}
function readCSV(file){if(!file)return;if(file.size>1024*1024){alert('Please choose a CSV under 1 MB for this demo.');return}let reader=new FileReader();reader.onload=()=>{let rows=parseCSV(String(reader.result).replace(/^\uFEFF/,''));if(rows.length<2){alert('No student rows found.');return}let headers=rows.shift().map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,'')),col=(...names)=>headers.findIndex(h=>names.includes(h));let id=col('studentid','id','sisid'),full=col('name','studentname','fullname'),first=col('firstname','first','studentfirstname'),last=col('lastname','last','studentlastname'),house=col('house');if(id<0||(full<0&&first<0)){alert('CSV needs student_id and name, or student_id and first_name.');return}let seen=new Set(state.students.map(s=>s.id.toLowerCase()));importRows=rows.map(r=>({id:(r[id]||'').trim(),name:full>=0?(r[full]||'').trim():`${r[first]||''} ${last>=0?r[last]||'':''}`.trim(),house:house>=0?(r[house]||'').trim():'Unassigned'})).filter(r=>{if(!r.id||!r.name||seen.has(r.id.toLowerCase()))return false;seen.add(r.id.toLowerCase());return true});if(!importRows.length)alert('No new valid students found; check IDs and duplicates.');render()};reader.readAsText(file)}
function commitImport(){if(!importRows?.length)return;for(let r of importRows)state.students.push({...r,look:state.students.length,photo:false,video:false});let count=importRows.length;importRows=null;save();go('roster');notice=`${count} students imported.`;render();setTimeout(()=>{$('.toast')?.remove();notice=''},3000)}
function dl(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const csvVal=x=>'"'+String(x).replace(/"/g,'""')+'"';
function downloadCSV(){let rows=[['student_id','name','class','house','photo_filename','video_filename'],...state.students.filter(done).map(s=>[s.id,s.name,state.className,s.house,s.id+'_photo.jpg',s.id+'_video.mp4'])];dl('rca-ready-roster-demo.csv',rows.map(r=>r.map(csvVal).join(',')).join('\r\n'),'text/csv')}
function downloadJSON(){dl('rca-media-manifest-demo.json',JSON.stringify({demo:true,notice:'File references below are placeholders. No photo or video bytes are included.',className:state.className,students:state.students.filter(done).map(s=>({studentId:s.id,name:s.name,house:s.house,photo:`${s.id}_photo.jpg`,video:`${s.id}_video.mp4`}))},null,2),'application/json')}
render();
</script></body></html>
