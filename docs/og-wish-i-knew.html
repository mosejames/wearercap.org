<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG — One Thing I Wish I Knew</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Newsreader:ital,opsz,wght@1,18,400&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#0E0C0B;color:#fff;
    font-family:'Archivo',system-ui,sans-serif;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:56px 64px;
  }
  .flame{
    background:linear-gradient(96deg,#e8a516 0%,#f26a1b 34%,#d8202d 68%,#e0218a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .mark{font-size:30px;font-weight:900;letter-spacing:-.025em;line-height:1}
  .mark small{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    letter-spacing:.22em;color:rgba(255,255,255,.5);margin-top:8px;
  }
  .topmeta{
    text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    letter-spacing:.2em;color:rgba(255,255,255,.5);line-height:2;
  }
  .kicker{
    font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:26px;
    color:rgba(255,255,255,.82);margin-bottom:14px;
  }
  h1{
    font-size:104px;line-height:.86;letter-spacing:-.045em;
    font-weight:900;text-transform:uppercase;
  }
  .strip{
    display:flex;gap:16px;align-items:center;
    font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;
    letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.62);
    border-top:1px solid rgba(255,255,255,.16);padding-top:22px;
  }
  .strip b{color:rgba(255,255,255,.3);font-weight:500}
</style>
</head>
<body>
  <div class="top">
    <div class="mark">We Are <span class="flame">RCAP</span><small>RON CLARK ACADEMY PARENTS</small></div>
    <div class="topmeta">PARENT TO PARENT<br />WEARERCAP.ORG</div>
  </div>

  <div>
    <p class="kicker">Parent to parent</p>
    <h1>One thing I wish<br /><span class="flame">I knew.</span></h1>
  </div>

  <div class="strip">
    <span>FOR THE CLASS OF 2031</span><b>·</b>
    <span>ADVICE FROM THE FAMILIES ALREADY HERE</span>
  </div>
</body>
</html>
